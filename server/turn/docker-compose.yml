version: '3.8'
services:
  coturn:
    image: coturn/coturn
    container_name: coturn
    restart: unless-stopped
    volumes:
      - ./config:/config
    env_file:
      - ./config/.env
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    entrypoint: ["/bin/sh", "-c", "sh /config/start.sh"]
