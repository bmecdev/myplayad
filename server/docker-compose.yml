version: '3.9'
services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "58080:58080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  videos:
    build:
      context: .
      dockerfile: Dockerfile.videos
    ports:
      - "8090:8090"
    volumes:
      # Volumen persistente: los videos viven en el HOST en /srv/videos
      # Estructura: /srv/videos/{screenId-guid}/*.mp4
      # El servicio ahora también descarga/cacha videos en local.
      - /srv/videos:/videos
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VIDEOS_DIR=/videos
      - VIDEO_PORT=8090
      - REMOTE_VIDEO_SERVER_URL=https://videos.myplayad.com

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: myplayad
    volumes:
      - /srv/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    container_name: portal
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/myplayad?schema=public
      - NODE_ENV=production
    volumes:
      - /srv/videos:/srv/videos
      - ../games:/srv/games
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    restart: unless-stopped
