name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Gatekeeper - Verificar que el código proviene de Staging
        run: |
          echo "=========================================================================="
          echo "🔒 Verificando que los cambios de Producción provienen de 'staging'..."
          echo "=========================================================================="
          git fetch origin staging:refs/remotes/origin/staging --depth=200
          if ! git merge-base --is-ancestor origin/staging HEAD 2>/dev/null && \
             ! git merge-base --is-ancestor HEAD origin/staging 2>/dev/null; then
            echo "❌ [DESPLIEGUE RECHAZADO]: Este commit no comparte historial con 'staging'."
            echo "Por política de seguridad de MyPlayAd, ningún cambio puede llegar a Producción"
            echo "sin haber sido mergeado y validado previamente en la rama 'staging'."
            exit 1
          fi
          echo "✓ [VERIFICADO]: El código proviene de la rama 'staging'. Continuando despliegue..."

      - name: Update Games Catalog in README.md
        run: |
          python3 .agents/skills/game/scripts/update-games-readme.py
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-actualizar catálogo de juegos en README.md [skip ci]"
            git push origin main
          fi

      - name: Copy Frontend (games & screen) via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "games/,screen/"
          target: "/var/www/myplayad/"
          strip_components: 0

      - name: Copy Backend (server & portal) via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/,portal/,games/"
          target: "/opt/myplayad/"
          strip_components: 0

      - name: Restart Backend Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            mkdir -p /srv/videos/pool
            chmod -R 777 /srv/videos 2>/dev/null || true
            cd /opt/myplayad/server
            docker compose up -d postgres
            sleep 3
            docker compose exec -T postgres psql -U postgres -c "ALTER USER postgres WITH PASSWORD 'mysecretpassword';" || true
            docker compose build prisma-db-push
            docker compose run --rm prisma-db-push npx prisma db push --accept-data-loss
            docker compose up -d --build --remove-orphans
            docker compose logs --tail=50 portal || true
