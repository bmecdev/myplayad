name: Deploy Staging to VPS

on:
  push:
    branches:
      - 'staging'
      - 'game/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Staging Directories Exist on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/myplayad-staging
            mkdir -p /opt/myplayad-staging
            mkdir -p /srv/videos-staging/pool
            chmod -R 777 /srv/videos-staging

      - name: Copy Frontend (games & screen) to Staging via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "games/,screen/"
          target: "/var/www/myplayad-staging/"
          strip_components: 0

      - name: Copy Backend (server & portal) to Staging via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/,portal/,games/"
          target: "/opt/myplayad-staging/"
          strip_components: 0

      - name: Setup Nginx & Staging Backend Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Configurar Nginx para dev-portal y dev-videos si existen los archivos
            if [ -d /etc/nginx/sites-available ]; then
              cp /opt/myplayad-staging/server/nginx/dev-portal.myplayad.com.conf /etc/nginx/sites-available/ || true
              cp /opt/myplayad-staging/server/nginx/dev-videos.myplayad.com.conf /etc/nginx/sites-available/ || true
              ln -sf /etc/nginx/sites-available/dev-portal.myplayad.com.conf /etc/nginx/sites-enabled/ || true
              ln -sf /etc/nginx/sites-available/dev-videos.myplayad.com.conf /etc/nginx/sites-enabled/ || true
              nginx -t && systemctl reload nginx || true
            fi

            # 2. Intentar emitir o renovar certificados SSL si Certbot está disponible
            if command -v certbot >/dev/null 2>&1; then
              certbot --nginx -d dev-portal.myplayad.com -d dev-videos.myplayad.com --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            fi

            # 3. Limpiar redes obsoletas si existen
            docker network rm myplayad-shared-net >/dev/null 2>&1 || true

            # 4. Asegurar que PostgreSQL en el proyecto principal esté corriendo y crear la base de datos myplayad_staging
            cd /opt/myplayad/server
            docker compose up -d postgres mosquitto
            sleep 3
            docker compose exec -T postgres psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'myplayad_staging'" | grep -q 1 || docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE myplayad_staging;" || true

            # 5. Desplegar servicios de Staging (Portal y Videos)
            cd /opt/myplayad-staging/server
            docker compose -p myplayad-staging -f docker-compose.staging.yml build prisma-db-push-staging
            docker compose -p myplayad-staging -f docker-compose.staging.yml run --rm prisma-db-push-staging npx prisma db push --accept-data-loss
            docker compose -p myplayad-staging -f docker-compose.staging.yml up -d --build --remove-orphans
            docker compose -p myplayad-staging -f docker-compose.staging.yml logs --tail=30 portal-staging
