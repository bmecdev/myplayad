# ==============================================================================
# MyPlayAd — Flags de Chromium Optimizadas para Raspberry Pi 4 (1GB RAM)
# Ubicación: ~/.config/chromium-flags.conf (o /etc/chromium/default)
# ==============================================================================

# --- Modo Kiosco y Experiencia Limpia ---
--kiosk
--noerrdialogs
--disable-infobars
--no-first-run
--fast
--fast-start
--autoplay-policy=no-user-gesture-required
--password-store=basic
--use-mock-keychain

# --- Desactivar Características Innecesarias ---
--disable-features=Translate,LockProfileCookieDatabase,MediaRouter,OptimizationHints
--disable-component-update
--disable-background-networking
--disable-sync
--disable-default-apps
--disable-extensions
--disable-notifications

# --- Modo Nativo Wayland (Sin servidor X11 / Xwayland) ---
--ozone-platform=wayland
--enable-features=OverlayScrollbar

# --- Optimización Crítica de Memoria RAM (Objetivo: < 350MB en 1GB) ---
# 1. Integra el proceso GPU dentro del proceso del navegador para ahorrar 80-120MB de RAM:
--in-process-gpu

# 2. Limita estrictamente los subprocesos de renderizado a 2 (reproductor principal + iframe del juego):
--renderer-process-limit=2

# 3. Evita desbordamiento de memoria compartida en /dev/shm:
--disable-dev-shm-usage

# 4. Desactiva el descarte de pestañas por presión de memoria (evita que el juego se congele):
--memory-pressure-off

# 5. Caché volátil en memoria RAM (evita desgaste y lentitud de la MicroSD):
--disk-cache-dir=/tmp/cache
--disk-cache-size=33554432

# --- Aceleración Gráfica por Hardware (VideoCore VI) ---
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=VaapiVideoDecoder
