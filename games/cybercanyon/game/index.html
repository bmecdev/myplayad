<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Canyon - Retro Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <!-- Consola Retro Arcade -->
        <div class="console-bezel">
            <div class="lcd-screen" id="main-screen">
                <div class="scanlines"></div>
                
                <!-- Cabecera de estado HUD -->
                <div class="game-header">
                    <div class="header-left">
                        <span id="player-nick">PILOT: ----</span>
                        <span id="score">SCORE: 0000</span>
                    </div>
                    <div id="shields-container">
                        SHIELDS: <span id="shields-count">3</span>
                    </div>
                    <div class="header-right">
                        <div class="header-right-top">
                            <span id="speed-indicator">120 KM/H</span>
                            <span id="high-score">HI: 0000</span>
                        </div>
                        <div class="room-ice-row">
                            <span id="room-id">ID: ----</span>
                            <span id="ice-route">ICE: --</span>
                            <button id="audio-toggle-btn" class="audio-toggle-btn muted" title="Activar/Silenciar Audio">🔊 AUDIO</button>
                        </div>
                    </div>
                </div>

                <!-- Canvas de renderizado 3D Vectorial -->
                <div class="canvas-wrapper">
                    <canvas id="gameCanvas" width="400" height="320"></canvas>
                </div>
                
                <!-- Overlay de Fin de Partida -->
                <div id="game-over-overlay" class="hidden">
                    <div class="overlay-content">
                        <h2 class="blink">SYSTEM CRASH</h2>
                        <div id="ranking-container">
                            <h3>HALL OF FAME</h3>
                            <ul id="ranking-list"></ul>
                        </div>
                        <p class="instruction">CLICK O ESPACIO PARA REINICIAR</p>
                    </div>
                </div>

                <!-- Pre-Game Video Ad Overlay -->
                <div id="ad-video-overlay" class="hidden">
                    <video id="ad-video-player" playsinline preload="auto"></video>
                    <div class="ad-hud-header">
                        <div class="ad-badge">📺 PUBLICIDAD</div>
                        <div id="ad-countdown" class="ad-countdown">INICIANDO...</div>
                    </div>
                    <div class="ad-hud-footer">
                        <div id="ad-pilot-name">PILOTO: PLAYER</div>
                        <div class="ad-subtext">EL VUELO COMIENZA EN BREVE</div>
                    </div>
                </div>

                <!-- Overlay de Modo Atracción & QR en Esquina -->
                <div id="waiting-overlay">
                    <!-- Banner Superior de Modo Demostración -->
                    <div class="attract-banner">
                        <span class="attract-live-dot">●</span>
                        <span class="attract-text">ESCANEA Y JUEGA <span class="highlight">GRATIS</span></span>
                    </div>

                    <!-- Solo Código QR en la Esquina -->
                    <div class="corner-qr-card" id="waiting-qr-panel" title="Escanea para jugar o haz clic aquí">
                        <div class="corner-qr-wrapper">
                            <div id="qrcode"></div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="console-footer">
                <div class="speaker-grille"></div>
                <div class="model-number">CYBER-CANYON-VR9</div>
                <div class="speaker-grille"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="qrcode.min.js"></script>
    <script src="config.js?v=2"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
