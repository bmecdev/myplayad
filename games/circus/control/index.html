<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circus Charlie Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <div id="status">INGRESA TU NICKNAME</div>
    
    <!-- Pantalla de Bienvenida / Nickname -->
    <div id="room-selection" class="welcome-container">
        <div class="header-logo">
            <div class="circus-icon">🎪</div>
            <h1>CIRCUS<span>CHARLIE</span></h1>
        </div>
        
        <div class="input-group">
            <p class="welcome-text">¡Bienvenido al Circo! Ingresa tu nombre para montar al león con Charlie.</p>
            <input type="text" id="nickname-input" placeholder="TU NOMBRE" maxlength="10">
            <input type="text" id="room-input" style="display: none;">
            <button id="connect-btn">ENTRAR AL CIRCO</button>
        </div>
        
        <p class="footer-hint">▲ Subir • ▼ Bajar • ◀ Frenar • Avanzar ▶ • ★ SALTO</p>
    </div>

    <!-- Pantalla de Agradecimiento (Game Over) -->
    <div id="thanks-screen" class="thanks-container" style="display: none;">
        <div class="header-logo">
            <h1>¡GRAN ACTUACIÓN!</h1>
        </div>
        <p id="thanks-message">¡Espectáculo finalizado!</p>
        <p class="small">Vuelve a escanear el código QR para jugar de nuevo.</p>
        <button id="play-again-btn" class="play-again-btn">🔄 ESCANEAR DE NUEVO</button>
    </div>

    <!-- Interfaz de Controles Táctiles -->
    <div class="controls-container" id="controls-container" style="display: none;">
        <!-- D-Pad Direccional en Cruz (Subir, Bajar, Frenar, Avanzar) -->
        <div class="dpad-container">
            <div class="dpad-row dpad-row-top">
                <button class="dpad-btn dpad-up" id="btn-up" data-dir="up">
                    <span class="dpad-arrow">▲</span>
                    <span class="dpad-sub">SUBIR</span>
                </button>
            </div>
            <div class="dpad-row dpad-row-middle">
                <button class="dpad-btn dpad-left" id="btn-left" data-dir="left">
                    <span class="dpad-arrow">◀</span>
                    <span class="dpad-sub">FRENAR</span>
                </button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" id="btn-right" data-dir="right">
                    <span class="dpad-arrow">▶</span>
                    <span class="dpad-sub">AVANZAR</span>
                </button>
            </div>
            <div class="dpad-row dpad-row-bottom">
                <button class="dpad-btn dpad-down" id="btn-down" data-dir="down">
                    <span class="dpad-arrow">▼</span>
                    <span class="dpad-sub">BAJAR</span>
                </button>
            </div>
        </div>

        <!-- Botón de Salto Gigante a la Derecha -->
        <div class="actions-wrapper">
            <button id="btn-jump" class="action-btn btn-jump">
                <span class="btn-icon">★</span>
                <span class="btn-text">SALTO</span>
            </button>
        </div>
    </div>

    <script src="config.js?v=1"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
