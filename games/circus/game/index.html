<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circus Charlie - Retro Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <!-- Consola Arcade Retro -->
        <div class="console-bezel">
            <div class="lcd-screen" id="main-screen">
                <div class="scanlines"></div>
                
                <div class="game-header">
                    <div class="hud-top-row">
                        <span id="score">000000</span>
                        <span id="high-score">HI-020000</span>
                        <span id="stage-display">STAGE-01</span>
                    </div>
                    <div class="hud-bottom-row">
                        <div class="hud-bonus-lives">
                            <span id="bonus-display" class="bonus-tag">BONUS-5000</span>
                            <span id="lives-container" class="lives-container"></span>
                        </div>
                        <div class="hud-meta">
                            <span id="player-nick">CHARLIE</span>
                            <span id="room-id">ID: ----</span>
                            <button id="audio-toggle-btn" class="audio-toggle-btn" title="Activar/Silenciar Música">🔊</button>
                        </div>
                    </div>
                </div>

                <div class="canvas-wrapper">
                    <canvas id="gameCanvas" width="200" height="160"></canvas>
                </div>
                
                <!-- Overlay de Fin de Juego (Game Over / Victoria) -->
                <div id="game-over-overlay" class="hidden">
                    <div class="overlay-content">
                        <h2 class="danger" id="game-over-title">GAME OVER</h2>
                        <div id="ranking-container">
                            <h3>HALL OF FAME</h3>
                            <ul id="ranking-list"></ul>
                        </div>
                        <p class="instruction" id="return-countdown-text">VOLVIENDO AL QR EN <span id="return-countdown">3</span>s...</p>
                        <p class="sub-hint blink" style="cursor: pointer; margin-top: 6px; color: var(--amber);">▶ CLICK O ESPACIO PARA VOLVER YA</p>
                    </div>
                </div>

                <!-- Pre-Game Video Ad Overlay -->
                <div id="ad-video-overlay" class="hidden">
                    <video id="ad-video-player" playsinline preload="auto"></video>
                    <div class="ad-hud-header">
                        <div class="ad-badge">📺 PUBLICIDAD</div>
                        <div id="ad-countdown" class="ad-countdown">INICIANDO...</div>
                    </div>
                    <div class="ad-hud-footer">
                        <div id="ad-pilot-name">CHARLIE: JUGADOR</div>
                        <div class="ad-subtext">EL SHOW COMIENZA EN BREVE</div>
                    </div>
                </div>

                <!-- Overlay de Modo Atracción & QR en Esquina -->
                <div id="waiting-overlay">
                    <!-- Banner Superior de Modo Demostración -->
                    <div class="attract-banner">
                        <span class="attract-live-dot">●</span>
                        <span class="attract-text">ESCANEA Y JUEGA <span class="highlight">GRATIS</span></span>
                    </div>

                    <!-- Solo Código QR en la Esquina -->
                    <div class="corner-qr-card" id="waiting-qr-panel" title="Escanea para jugar o haz clic aquí">
                        <div class="corner-qr-wrapper">
                            <div id="qrcode"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grille inferior de la cabina arcade -->
            <div class="console-footer">
                <div class="speaker-grille"></div>
                <div class="model-number">CIRCUS-CHARLIE-X9</div>
                <div class="speaker-grille"></div>
            </div>
        </div>
    </div>

    <script src="qrcode.min.js"></script>
    <script src="config.js?v=2"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
