<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyroads - Cosmic Runway Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <div class="container">
        <!-- Parte Superior: Consola Retro Arcade -->
        <div class="console-bezel">
            <div class="lcd-screen" id="main-screen">
                <div class="scanlines"></div>
                
                <div class="game-header">
                    <div class="header-left">
                        <span id="player-nick">PILOT: ----</span>
                        <span id="score">SCORE: 0000</span>
                    </div>
                    <div id="lives-container">
                        SHIPS: <span id="lives-count">3</span>
                    </div>
                    <div class="header-right">
                        <span id="high-score">HI: 0000</span>
                        <div class="room-ice-row">
                            <span id="room-id">ID: ----</span>
                            <span id="speed-meter">KM/H: 0</span>
                            <button id="audio-toggle-btn" class="audio-toggle-btn muted" title="Activar/Silenciar Audio">🔊 AUDIO</button>
                        </div>
                    </div>
                </div>

                <div class="canvas-wrapper">
                    <canvas id="gameCanvas" width="200" height="160"></canvas>
                </div>
                
                <!-- Mensaje de Fin de Juego -->
                <div id="game-over-overlay" class="hidden">
                    <div class="overlay-content">
                        <h2 class="blink" id="game-over-title">GAME OVER</h2>
                        <div id="ranking-container">
                            <h3>HALL OF FAME</h3>
                            <ul id="ranking-list"></ul>
                        </div>
                        <div id="game-over-upcoming-container" style="display: none; width: 100%; margin-top: 20px;">
                            <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--accent);">PRÓXIMOS JUEGOS</h3>
                            <ul id="game-over-upcoming-list" style="list-style: none; padding: 0; margin: 0; width: 90%; color: white; font-size: 12px; margin-left: auto; margin-right: auto;"></ul>
                        </div>
                        <p class="instruction">CLICK O ESPACIO PARA REINICIAR</p>
                    </div>
                </div>

                <!-- Overlay de Conexión / Espera -->
                <div id="waiting-overlay">
                    <div class="overlay-content">
                        <h2 class="arcade-title">SKY<span>ROADS</span></h2>
                        <p class="pulse-text">¡ESCANEA PARA PILOTAR!</p>
                        <div class="qr-wrapper">
                            <img id="qr-code-img" src="" alt="QR">
                        </div>
                        <p class="status-text">¡ESQUIVA LOS HUECOS Y SALTA CON TU NAVE!</p>
                    </div>
                </div>

            </div>
            <div class="console-footer">
                <div class="speaker-grille"></div>
                <div class="model-number">SKY-ROADS-3D</div>
                <div class="speaker-grille"></div>
            </div>
        </div>

        <!-- Parte Inferior: Reproductor de Video Publicitario -->
        <div class="video-container">
            <div class="video-bezel">
                <video id="bgVideo" muted autoplay playsinline></video>
                <div id="video-ranking-overlay" class="hidden">
                    <div class="ranking-header">HALL OF FAME</div>
                    <ul id="video-ranking-list"></ul>
                    <div id="upcoming-games-container" style="display: none; width: 100%; margin-top: 20px;">
                        <div class="ranking-header" style="font-size: 18px; margin-bottom: 15px;">PRÓXIMOS JUEGOS</div>
                        <ul id="upcoming-games-list" style="list-style: none; padding: 0; margin: 0; width: 90%; color: white; font-size: 12px; font-family: 'Courier New', Courier, monospace; margin-left: auto; margin-right: auto;"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js?v=1"></script>
    <script src="script.js?v=5"></script>
    <script src="video_loop.js?v=1"></script>
</body>
</html>
