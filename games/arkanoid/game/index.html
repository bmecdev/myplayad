<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid Clon - Retro Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <div class="container">
        <!-- Consola Retro Arcade -->
        <div class="console-bezel">
            <div class="lcd-screen" id="main-screen">
                <div class="scanlines"></div>
                
                <div class="game-header">
                    <div class="header-left">
                        <span id="player-nick">PLAYER: ----</span>
                        <span id="score">SCORE: 000</span>
                    </div>
                    <div id="lives-container">
                        LIVES: <span id="lives-count">3</span>
                    </div>
                    <div class="header-right">
                        <span id="high-score">HI: 000</span>
                        <div class="room-ice-row">
                            <span id="room-id">ID: ----</span>
                            <span id="ice-route">ICE: --</span>
                            <button id="audio-toggle-btn" class="audio-toggle-btn muted" title="Activar/Silenciar Audio">🔊 AUDIO</button>
                        </div>
                    </div>
                </div>

                <div class="canvas-wrapper">
                    <canvas id="gameCanvas" width="200" height="160"></canvas>
                </div>
                
                <!-- Mensaje de Fin de Juego -->
                <div id="game-over-overlay" class="hidden">
                    <div class="overlay-content">
                        <h2 class="blink">GAME OVER</h2>
                        <div id="ranking-container">
                            <h3>HALL OF FAME</h3>
                            <ul id="ranking-list"></ul>
                        </div>
                        <p class="instruction">CLICK TO RESTART</p>
                    </div>
                </div>

                <!-- Overlay de Video Publicitario Pre-Juego -->
                <div id="ad-video-overlay" class="hidden">
                    <video id="ad-video-player" playsinline preload="auto"></video>
                    <div class="ad-hud-header">
                        <span class="ad-badge">📺 PUBLICIDAD</span>
                        <span class="ad-countdown" id="ad-countdown">INICIANDO...</span>
                    </div>
                    <div class="ad-hud-footer">
                        <span class="ad-pilot-name" id="ad-pilot-name">PILOTO: ----</span>
                        <span class="ad-subtext">EL JUEGO COMENZARÁ AL FINALIZAR</span>
                    </div>
                </div>

                <!-- Overlay de Modo Atracción & QR en Esquina -->
                <div id="waiting-overlay">
                    <!-- Banner Superior de Modo Demostración -->
                    <div class="attract-banner">
                        <span class="attract-live-dot">●</span>
                        <span class="attract-text">GAMEPLAY DEMO</span>
                        <span class="attract-sep">|</span>
                        <span class="attract-hint">ESCANEA PARA JUGAR</span>
                    </div>

                    <!-- Tarjeta de Código QR en la Esquina -->
                    <div class="corner-qr-card" id="waiting-qr-panel">
                        <div class="corner-qr-header">
                            <span class="corner-qr-icon">📱</span>
                            <span class="corner-qr-title">ESCANEA Y JUEGA</span>
                        </div>
                        <div class="corner-qr-wrapper">
                            <div id="qrcode"></div>
                        </div>
                        <div class="corner-qr-footer">
                            <span id="corner-room-badge" class="corner-room-badge">SALA: ----</span>
                            <div class="corner-buttons">
                                <button id="instant-play-btn" class="corner-btn corner-btn-play" title="Probar con teclado">▶ TECLADO</button>
                                <button id="toggle-hall-btn" class="corner-btn corner-btn-rank" title="Ver ranking">🏆 RANK</button>
                            </div>
                        </div>
                    </div>

                    <!-- Mini Panel Flotante de Ranking Alternativo en Esquina -->
                    <div class="corner-qr-card hidden" id="waiting-ranking-panel">
                        <div class="corner-qr-header">
                            <span class="corner-qr-icon">🏆</span>
                            <span class="corner-qr-title">HALL OF FAME</span>
                        </div>
                        <div class="corner-ranking-content">
                            <ul id="standby-ranking-list" class="corner-ranking-list"></ul>
                        </div>
                        <div class="corner-qr-footer">
                            <div class="corner-buttons">
                                <button id="back-to-qr-btn" class="corner-btn corner-btn-play">📱 VER QR</button>
                                <button id="instant-play-btn-2" class="corner-btn corner-btn-rank">▶ JUGAR</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="console-footer">
                <div class="speaker-grille"></div>
                <div class="model-number">ARKANOID-X9</div>
                <div class="speaker-grille"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="qrcode.min.js"></script>
    <script src="config.js?v=13"></script>
    <script src="script.js?v=24"></script>
</body>
</html>
